<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>How Shelly connects ChatGPT to local macOS tools</title>
    <style>
      :root {
        --page: #0a0a0a;
        --paper: #141414;
        --bar: #1b1b1b;
        --border: #2b2b2b;
        --ink: #f5f5f5;
        --muted: #9a9a9a;
        --soft: #5c5c5c;
        --accent: #ff5a36;
        --accent-tint: rgba(255, 90, 54, 0.12);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        background: var(--page);
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .terminal {
        max-width: 960px;
        margin: 0 auto;
        overflow: hidden;
        background: var(--paper);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .titlebar {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 16px;
        background: var(--bar);
        border-bottom: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
      }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--soft); }
      .dot.accent { background: var(--accent); }
      .name { margin-left: 8px; }
      .frame { padding: 20px 24px 24px; }
      .prompt { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
      .prompt strong { color: var(--accent); font-weight: 600; }
      h1 { margin: 0 0 12px; font-size: 20px; line-height: 1.3; }
      svg { display: block; width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <div class="terminal">
      <div class="titlebar">
        <span class="dot accent"></span><span class="dot"></span><span class="dot"></span>
        <span class="name">shelly — architecture</span>
      </div>
      <div class="frame">
        <p class="prompt"><strong>$</strong> shelly explain --how-it-works</p>
        <h1># ChatGPT → local macOS agent tools</h1>
        <svg viewBox="0 0 960 400" role="img" aria-labelledby="chatgpt-local-shell-mcp-architecture-title chatgpt-local-shell-mcp-architecture-desc">
          <title id="chatgpt-local-shell-mcp-architecture-title">How Shelly connects ChatGPT to local macOS tools</title>
          <desc id="chatgpt-local-shell-mcp-architecture-desc">ChatGPT reaches Shelly through an ngrok trust boundary, then Shelly routes tool calls to persistent shells, patch and web tools, and optional macOS and browser adapters.</desc>
          <defs>
            <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="#9a9a9a" />
            </marker>
            <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="#ff5a36" />
            </marker>
            <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="#9a9a9a" />
            </marker>
          </defs>

          <rect width="960" height="400" fill="#141414" />

          <rect x="216" y="132" width="208" height="136" rx="8" fill="rgba(255,255,255,0.02)" stroke="#2b2b2b" stroke-width="1" stroke-dasharray="4,4" />
          <rect x="232" y="136" width="112" height="16" rx="4" fill="#141414" />
          <text x="288" y="148" fill="#5c5c5c" font-size="8" text-anchor="middle" letter-spacing="1.2">TRUST BOUNDARY</text>

          <line x1="184" y1="200" x2="240" y2="200" stroke="#9a9a9a" stroke-width="1.2" marker-end="url(#arrow)" />
          <line x1="400" y1="200" x2="456" y2="200" stroke="#ff5a36" stroke-width="1.2" marker-end="url(#arrow-accent)" />
          <path d="M 616 168 H 648 Q 656 168 656 160 V 108 Q 656 100 664 100 H 720" fill="none" stroke="#9a9a9a" stroke-width="1.2" marker-end="url(#arrow)" />
          <line x1="616" y1="200" x2="720" y2="200" stroke="#9a9a9a" stroke-width="1.2" marker-end="url(#arrow)" />
          <path d="M 616 232 H 672 Q 680 232 680 240 V 292 Q 680 300 688 300 H 720" fill="none" stroke="#9a9a9a" stroke-width="1.2" marker-end="url(#arrow)" />

          <rect x="24" y="160" width="160" height="80" rx="8" fill="#141414" />
          <rect x="24" y="160" width="160" height="80" rx="8" fill="rgba(255,255,255,0.02)" stroke="#5c5c5c" stroke-width="1" />
          <text x="104" y="196" fill="#f5f5f5" font-size="14" font-weight="600" text-anchor="middle">ChatGPT</text>
          <text x="104" y="216" fill="#9a9a9a" font-size="10" text-anchor="middle">remote MCP client</text>

          <rect x="240" y="160" width="160" height="80" rx="8" fill="#141414" />
          <rect x="240" y="160" width="160" height="80" rx="8" fill="rgba(255,255,255,0.02)" stroke="#5c5c5c" stroke-width="1" />
          <text x="320" y="196" fill="#f5f5f5" font-size="14" font-weight="600" text-anchor="middle">ngrok</text>
          <text x="320" y="216" fill="#9a9a9a" font-size="10" text-anchor="middle">ChatGPT-origin filter</text>

          <rect x="456" y="140" width="160" height="120" rx="8" fill="#141414" />
          <rect x="456" y="140" width="160" height="120" rx="8" fill="rgba(255,90,54,0.12)" stroke="#ff5a36" stroke-width="1.2" />
          <text x="536" y="188" fill="#f5f5f5" font-size="16" font-weight="700" text-anchor="middle">Shelly MCP</text>
          <text x="536" y="212" fill="#9a9a9a" font-size="10" text-anchor="middle">localhost:3333/mcp</text>
          <text x="536" y="232" fill="#9a9a9a" font-size="10" text-anchor="middle">owner-bound routing</text>

          <rect x="720" y="60" width="216" height="80" rx="8" fill="#141414" />
          <rect x="720" y="60" width="216" height="80" rx="8" fill="rgba(255,255,255,0.02)" stroke="#5c5c5c" stroke-width="1" />
          <text x="828" y="96" fill="#f5f5f5" font-size="14" font-weight="600" text-anchor="middle">Persistent shells</text>
          <text x="828" y="116" fill="#9a9a9a" font-size="10" text-anchor="middle">state + bounded output</text>

          <rect x="720" y="160" width="216" height="80" rx="8" fill="#141414" />
          <rect x="720" y="160" width="216" height="80" rx="8" fill="rgba(255,255,255,0.02)" stroke="#5c5c5c" stroke-width="1" />
          <text x="828" y="196" fill="#f5f5f5" font-size="14" font-weight="600" text-anchor="middle">Patch + web tools</text>
          <text x="828" y="216" fill="#9a9a9a" font-size="10" text-anchor="middle">apply_patch · fetch_website</text>

          <rect x="720" y="260" width="216" height="80" rx="8" fill="#141414" />
          <rect x="720" y="260" width="216" height="80" rx="8" fill="rgba(255,255,255,0.02)" stroke="#5c5c5c" stroke-width="1" />
          <text x="828" y="296" fill="#f5f5f5" font-size="14" font-weight="600" text-anchor="middle">macOS + browser</text>
          <text x="828" y="316" fill="#9a9a9a" font-size="10" text-anchor="middle">Computer Use · subagents</text>

          <line x1="24" y1="372" x2="936" y2="372" stroke="#2b2b2b" stroke-width="1" />
          <text x="24" y="392" fill="#5c5c5c" font-size="8" letter-spacing="1.2">LOCAL EXECUTION STAYS ON YOUR MAC</text>
        </svg>
      </div>
    </div>
  </body>
</html>
